name: rates-burst-sync

on:
  # Run immediately after source changes; ignore the collector's own data commits.
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - 'fetch.log'
  # A scheduled trigger restarts collection independently of the keeper chain.
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      continue_chain:
        description: 'Legacy keeper compatibility input'
        required: false
        default: true
        type: boolean
      trigger_reason:
        description: 'Why this run was started'
        required: false
        default: 'manual'
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: exchanges-rate-sync-chain
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # run_collection.py bounds the primary collection and optional baseline refresh.
    # Leave room for dependency setup and committing the result.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Sync latest main before collecting
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect rates and refresh first publications
        id: poll
        run: python scripts/run_collection.py
        env:
          TRIGGER_REASON: ${{ inputs.trigger_reason || github.event_name }}

      - name: Commit all exchange updates
        if: steps.poll.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ steps.poll.outputs.had_success }}" = "true" ]; then
            git add data fetch.log
          else
            git add data/status.json fetch.log
          fi
          if git diff --cached --quiet; then
            echo "No exchange changes"
            exit 0
          fi
          git commit -m "chore: update exchange data (auto)"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep "$((attempt * 2))"
            git pull --rebase origin main
          done

      - name: Fail if primary collection failed
        if: steps.poll.outputs.had_success != 'true'
        run: |
          echo "Primary exchange collection failed. See fetch.log and data/status.json for details."
          exit 1

      - name: Dispatch Pages after manual or keeper collection
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --repo 0707soo/exchanges
