name: chain-keeper

on:
  workflow_dispatch:
    inputs:
      monitor_minutes:
        description: 'How long to keep monitoring in this run'
        required: false
        default: '330'
        type: string
      stale_limit_seconds:
        description: 'Stop if the repo status is stale beyond this many seconds'
        required: false
        default: '1800'
        type: string
      continue_keeper:
        description: 'Redispatch this keeper before it exits'
        required: false
        default: true
        type: boolean

permissions:
  actions: write
  contents: read

concurrency:
  group: exchanges-chain-keeper
  cancel-in-progress: false

jobs:
  restart:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Monitor and restart exchange chain
        env:
          GH_TOKEN: ${{ github.token }}
          MONITOR_MINUTES: ${{ inputs.monitor_minutes || '330' }}
          STALE_LIMIT_SECONDS: ${{ inputs.stale_limit_seconds || '1800' }}
          CONTINUE_KEEPER: ${{ inputs.continue_keeper != false }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import time
          from datetime import datetime, timezone
          from pathlib import Path

          monitor_minutes = int(os.environ.get('MONITOR_MINUTES', '330'))
          stale_limit_seconds = int(os.environ.get('STALE_LIMIT_SECONDS', '1800'))
          continue_keeper = os.environ.get('CONTINUE_KEEPER', 'true').lower() == 'true'
          deadline = time.time() + monitor_minutes * 60

          def run_workflow_with_retry(args, kind, attempts=5, base_sleep=15):
              last_error = None
              for attempt in range(1, attempts + 1):
                  proc = subprocess.run(args, capture_output=True, text=True)
                  if proc.returncode == 0:
                      if proc.stdout.strip():
                          print(proc.stdout.strip())
                      return True
                  last_error = (proc.stderr or proc.stdout or '').strip()
                  print(json.dumps({
                      'action': f'{kind}-retry',
                      'attempt': attempt,
                      'attempts': attempts,
                      'error': last_error,
                  }, ensure_ascii=False))
                  if attempt < attempts:
                      time.sleep(base_sleep * attempt)
              print(json.dumps({
                  'action': f'{kind}-failed',
                  'error': last_error,
              }, ensure_ascii=False))
              return False

          def read_status():
              path = Path('data/status.json')
              if not path.exists():
                  return {}
              return json.loads(path.read_text(encoding='utf-8'))

          def git_refresh():
              subprocess.run(['git', 'fetch', 'origin', 'main'], check=True, capture_output=True, text=True)
              subprocess.run(['git', 'checkout', '--force', 'origin/main', '--', 'data/status.json'], check=False)

          def list_runs():
              out = subprocess.check_output([
                  'gh', 'run', 'list',
                  '--repo', '0707soo/exchanges',
                  '--workflow', 'rates-burst-sync.yml',
                  '--limit', '10',
                  '--json', 'databaseId,status,conclusion,createdAt,event'
              ], text=True)
              return json.loads(out)

          def any_active(runs):
              return any(run.get('status') in ('queued', 'in_progress') for run in runs)

          while time.time() < deadline:
              git_refresh()
              status = read_status()
              runs = list_runs()
              active = any_active(runs)
              now = datetime.now(timezone.utc)
              ended = status.get('window_ended_at_utc')
              stale = True
              if ended:
                  ended_dt = datetime.fromisoformat(ended)
                  stale = (now - ended_dt).total_seconds() > stale_limit_seconds

              delay = int(status.get('next_delay_seconds') or 120)
              should_dispatch = stale or not active

              if should_dispatch and not active:
                  print(json.dumps({
                      'action': 'dispatch',
                      'reason': 'stale-status' if stale else 'no-active-run',
                      'delay': delay,
                      'status': status,
                  }, ensure_ascii=False))
                  dispatched = run_workflow_with_retry([
                      'gh', 'workflow', 'run', 'rates-burst-sync.yml',
                      '--repo', '0707soo/exchanges',
                      '-f', 'continue_chain=true',
                      '-f', 'trigger_reason=chain-keeper'
                  ], 'dispatch-rates')
                  if dispatched:
                      time.sleep(15)
                  else:
                      time.sleep(60)
              else:
                  print(json.dumps({
                      'action': 'wait-active' if active else 'wait',
                      'reason': 'stale-but-run-active' if stale and active else 'healthy',
                      'delay': delay,
                  }, ensure_ascii=False))

              sleep_for = 30 if stale else max(30, min(delay, 300))
              time.sleep(sleep_for)

          if continue_keeper:
              print(json.dumps({'action': 'redispatch-self'}, ensure_ascii=False))
              run_workflow_with_retry([
                  'gh', 'workflow', 'run', 'chain-keeper.yml',
                  '--repo', '0707soo/exchanges',
                  '-f', f'monitor_minutes={monitor_minutes}',
                  '-f', f'stale_limit_seconds={stale_limit_seconds}',
                  '-f', 'continue_keeper=true'
              ], 'redispatch-chain-keeper', attempts=8, base_sleep=20)

          print(json.dumps({'action': 'done'}, ensure_ascii=False))
          PY